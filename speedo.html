<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>WaterFall RP — Speedometer</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:'Rajdhani','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}

#stage{position:fixed;right:28px;bottom:28px;transform-origin:100% 100%;opacity:0;transition:opacity .5s ease;pointer-events:none;user-select:none}
#stage.on{opacity:1}

#panel{width:316px;padding:14px 18px 16px;background:transparent;border:none;box-shadow:none}

#brand{text-align:center;font-size:11px;font-weight:700;letter-spacing:.42em;color:rgba(140,215,255,.55);margin-bottom:4px;padding-left:.42em}

#gaugeWrap{position:relative;width:280px;height:280px;margin:0 auto}
#readout{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#speedVal{font-family:'Orbitron',monospace;font-size:58px;font-weight:900;line-height:1;
 background:linear-gradient(180deg,#ffffff,#8fdcff);-webkit-background-clip:text;background-clip:text;color:transparent;
 text-shadow:0 0 18px rgba(0,200,255,.35);font-variant-numeric:tabular-nums}
#unit{margin-top:6px;font-size:12px;font-weight:600;letter-spacing:.35em;color:rgba(160,220,255,.6);padding-left:.35em}

#fuelrow{display:flex;align-items:center;gap:10px;margin-top:10px}
#fuelbar{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden;border:1px solid rgba(255,255,255,.06)}
#fuelFill{height:100%;width:0%;border-radius:6px;background:linear-gradient(90deg,#00e5ff,#00ff9d);box-shadow:0 0 12px rgba(0,230,200,.55)}
#fuelFill.warn{background:linear-gradient(90deg,#ffb300,#ff8a00)}
#fuelFill.low{background:linear-gradient(90deg,#ff3355,#ff0055);animation:fuelpulse 1s ease-in-out infinite}
@keyframes fuelpulse{50%{opacity:.4}}
#fuelVal{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;color:rgba(190,235,255,.85);width:46px;text-align:right}

#leds{display:flex;gap:10px;margin-top:12px}
.led{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 0;border-radius:10px;
 background:transparent;border:none;transition:.25s}
.led b{font-family:'Orbitron',monospace;font-size:14px;color:rgba(255,255,255,.25);transition:.25s}
.led i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.18em;color:rgba(255,255,255,.3);transition:.25s}
.led.on{background:rgba(0,190,255,.12);border-color:rgba(0,200,255,.45);box-shadow:0 0 16px rgba(0,190,255,.25), inset 0 0 12px rgba(0,190,255,.12)}
.led.on b{color:#5fe6ff;text-shadow:0 0 10px rgba(0,220,255,.9)}
.led.on i{color:rgba(160,230,255,.8)}

svg circle{fill:none}
#track{stroke:rgba(255,255,255,.08);stroke-width:10;stroke-linecap:round}
#arcFg{stroke-width:10;stroke-linecap:round;filter:url(#glow)}
.tick{stroke:rgba(255,255,255,.18);stroke-width:2}
.tick.major{stroke:rgba(190,235,255,.55);stroke-width:3}
.ticklbl{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;fill:rgba(200,240,255,.55)}
</style>
<base target="_blank">
</head>
<body>
<div id="stage">
  <div id="panel">
    <div id="brand">WATERFALL RP</div>
    <div id="gaugeWrap">
      <svg id="gauge" width="280" height="280" viewBox="0 0 280 280">
        <defs>
          <linearGradient id="gradSpeed" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#00e5ff"/>
            <stop offset="0.45" stop-color="#00ff9d"/>
            <stop offset="0.75" stop-color="#ffd24d"/>
            <stop offset="1" stop-color="#ff3b5c"/>
          </linearGradient>
          <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <circle id="track" cx="140" cy="140" r="104" transform="rotate(135 140 140)"/>
        <g id="ticks"></g>
        <circle id="arcFg" cx="140" cy="140" r="104" transform="rotate(135 140 140)" stroke="url(#gradSpeed)"/>
      </svg>
      <div id="readout">
        <div id="speedVal">0</div>
        <div id="unit">КМ/Ч</div>
      </div>
    </div>
    <div id="fuelrow">
      <svg id="fuelIcon" width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M5 21V6a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v15" stroke="#7fdcff" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M4 21h11" stroke="#7fdcff" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M14 9h2.2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V9.8L19 7" stroke="#7fdcff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M7.5 8.5h4v4h-4z" stroke="#7fdcff" stroke-width="1.4"/>
      </svg>
      <div id="fuelbar"><div id="fuelFill"></div></div>
      <div id="fuelVal">0%</div>
    </div>
    <div id="leds">
      <div class="led" id="ledE"><b>E</b><i>ДВИГАТЕЛЬ</i></div>
      <div class="led" id="ledL"><b>L</b><i>ФАРЫ</i></div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var MAX_SPEED = 240, SWEEP = 240, CX = 140, CY = 140, R = 104;
var C = 2*Math.PI*R, ARC = C*(SWEEP/360);

var stage=$('stage'), speedVal=$('speedVal'), fuelFill=$('fuelFill'), fuelVal=$('fuelVal'),
    ledE=$('ledE'), ledL=$('ledL'), arcFg=$('arcFg'), track=$('track'), ticks=$('ticks');

track.setAttribute('stroke-dasharray', ARC+' '+C);
arcFg.setAttribute('stroke-dasharray', ARC+' '+C);
arcFg.setAttribute('stroke-dashoffset', ARC);

/* ---- риски и цифры ---- */
var NS='http://www.w3.org/2000/svg';
for(var d=0; d<=SWEEP; d+=5){
  var major=(d%20===0), labeled=(d%40===0);
  var a=d*Math.PI/180, r1=124, r0=124-(major?12:6);
  var l=document.createElementNS(NS,'line');
  l.setAttribute('x1',CX+r0*Math.cos(a)); l.setAttribute('y1',CY+r0*Math.sin(a));
  l.setAttribute('x2',CX+r1*Math.cos(a)); l.setAttribute('y2',CY+r1*Math.sin(a));
  l.setAttribute('class', major?'tick major':'tick');
  ticks.appendChild(l);
  if(labeled){
    var v=Math.round(d/SWEEP*MAX_SPEED);
    var t=document.createElementNS(NS,'text');
    t.setAttribute('x',CX+86*Math.cos(a)); t.setAttribute('y',CY+86*Math.sin(a)+4);
    t.setAttribute('text-anchor','middle'); t.setAttribute('class','ticklbl');
    t.textContent=v;
    ticks.appendChild(t);
  }
}
ticks.setAttribute('transform','rotate(135 '+CX+' '+CY+')');

/* ---- состояние ---- */
var target={speed:0,fuel:0,engine:0,lights:0};
var disp={speed:0};

function update(speed,fuel,engine,lights){
  target.speed=Math.max(0,+speed||0);
  target.fuel=Math.max(0,Math.min(100,+fuel||0));
  target.engine=engine?1:0;
  target.lights=lights?1:0;
  stage.classList.add('on');
}
function hide(){ stage.classList.remove('on'); }

/* ---- плавный рендер ---- */
function render(){
  disp.speed+=(target.speed-disp.speed)*0.16;
  if(Math.abs(target.speed-disp.speed)<0.05) disp.speed=target.speed;
  var frac=Math.max(0,Math.min(1,disp.speed/MAX_SPEED));
  arcFg.setAttribute('stroke-dashoffset', ARC*(1-frac));
  speedVal.textContent=Math.round(disp.speed);
  fuelFill.style.width=target.fuel+'%';
  fuelVal.textContent=Math.round(target.fuel)+'%';
  fuelFill.className = target.fuel<=15 ? 'low' : (target.fuel<=35 ? 'warn' : '');
  ledE.classList.toggle('on', !!target.engine);
  ledL.classList.toggle('on', !!target.lights);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);

/* ---- масштаб под разрешение ---- */
function fit(){
  var s=window.innerWidth/1600;
  s=Math.max(0.62,Math.min(1.2,s));
  stage.style.transform='scale('+s+')';
}
window.addEventListener('resize',fit); fit();

/* ---- привязка к SAMP CEF (zottce samp-cef) ---- */
if(window.cef && typeof cef.on==='function'){
 cef.on('showSpeedo', function(){ show(); });
 cef.on('hideSpeedo', function(){ hide(); });
  cef.on('updateSpeedo', function(speed,fuel,engine,lights){
    if(typeof speed==='string'){ // страховка, если пришла строка "s f e l"
      var p=speed.split(/\s+/);
      update(p[0],p[1],p[2],p[3]); return;
    }
    update(speed,fuel,engine,lights);
  });
  cef.on('hideSpeedo', function(){ hide(); });
}else{
  /* демо-режим: открыть файл в обычном браузере для проверки */
  var t=0;
  setInterval(function(){
    t+=0.12;
    update(Math.max(0,Math.round(120+Math.sin(t)*115)),
           Math.max(0,Math.min(100,55+Math.sin(t*0.35)*50)),
           1,(Math.sin(t*0.8)>0)?1:0);
  },180);
}
})();
</script>
</body>
</html>
