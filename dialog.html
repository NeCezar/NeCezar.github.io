<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        /* Цветовая палитра в морских тонах */
        :root {
            --bg-dark: rgba(10, 26, 42, 0.85);
            --border-glow: #00e5ff;
            --header-bg: linear-gradient(90deg, #005c97, #363795);
            --item-bg: rgba(255, 255, 255, 0.05);
            --item-hover: rgba(0, 229, 255, 0.2);
            --item-active: rgba(0, 229, 255, 0.4);
            --text-main: #e0f7fa;
            --text-muted: #80deea;
            --btn-accept: #00bcd4;
            --btn-cancel: #455a64;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: transparent; /* Важно для CEF */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Контейнер диалога */
        .dialog-box {
            width: 500px;
            background: var(--bg-dark);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(0, 229, 255, 0.1);
            backdrop-filter: blur(10px); /* Эффект стекла */
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Шапка */
        .dialog-header {
            background: var(--header-bg);
            padding: 15px 20px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-glow);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        /* Список */
        .dialog-list {
            padding: 10px;
            max-height: 350px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        /* Скроллбар */
        .dialog-list::-webkit-scrollbar { width: 8px; }
        .dialog-list::-webkit-scrollbar-track { background: transparent; }
        .dialog-list::-webkit-scrollbar-thumb { background: var(--border-glow); border-radius: 4px; }

        /* Элемент списка */
        .list-item {
            padding: 12px 15px;
            background: var(--item-bg);
            color: var(--text-main);
            border-radius: 6px;
            border-left: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
        }

        .list-item:hover {
            background: var(--item-hover);
            border-left-color: var(--border-glow);
            padding-left: 20px; /* Эффект сдвига при наведении */
        }

        /* Выбранный элемент */
        .list-item.active {
            background: var(--item-active);
            border-left-color: #fff;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        /* Подвал с кнопками */
        .dialog-footer {
            display: flex;
            justify-content: flex-end;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(0, 229, 255, 0.2);
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        #btn-accept {
            background: var(--btn-accept);
            color: #000;
        }
        
        #btn-accept:hover { background: #00e5ff; box-shadow: 0 0 15px rgba(0, 229, 255, 0.5); }
        
        #btn-cancel {
            background: var(--btn-cancel);
            color: var(--text-main);
        }
        
        #btn-cancel:hover { background: #546e7a; }
    </style>
</head>
<body>
    <div class="dialog-box">
        <div class="dialog-header" id="dialog-title">Выберите действие</div>
        
        <div class="dialog-list" id="dialog-list">
            <!-- Элементы будут добавляться через JS -->
        </div>
        
        <div class="dialog-footer">
            <button id="btn-cancel" onclick="handleCancel()">Отмена</button>
            <button id="btn-accept" onclick="handleAccept()">Выбрать</button>
        </div>
    </div>

    <script>
        let selectedIndex = -1;

        // Функция для получения списка из Pawn
        cef.on("setupDialog", function(title, itemsString) {
            document.getElementById('dialog-title').innerText = title;
            
            const listContainer = document.getElementById('dialog-list');
            listContainer.innerHTML = ''; // Очищаем
            
            // Pawn передает строку, разделенную символом \n или |, разбиваем на массив
            const items = itemsString.split("|"); 

            items.forEach((itemText, index) => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerText = (index + 1) + ". " + itemText;
                div.onclick = () => selectItem(index, div);
                listContainer.appendChild(div);
            });

            // Сбрасываем выбор
            selectedIndex = -1;
        });

        function selectItem(index, element) {
            // Убираем активный класс у всех
            document.querySelectorAll('.list-item').forEach(el => el.classList.remove('active'));
            // Добавляем текущему
            element.classList.add('active');
            selectedIndex = index;
        }

        function handleAccept() {
            if (selectedIndex === -1) {
                // Если ничего не выбрано, можно мигнуть красным или просто проигнорировать
                return; 
            }
            // Отправляем в Pawn: response = 1, index = выбранный пункт
            cef.emit("dialogResponse", 1, selectedIndex);
        }

        function handleCancel() {
            // Отправляем в Pawn: response = 0, index = -1
            cef.emit("dialogResponse", 0, -1);
        }
    </script>
</body>
</html>
