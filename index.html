<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WaterFall RolePlay | CEF HUD</title>
<style>
:root{--cyan:#35d4f2;--white:#f1faff;--glass:rgba(4,43,70,.56);--edge:rgba(70,210,246,.65)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:"Segoe UI",Arial,sans-serif;color:var(--white);user-select:none}
.hud{position:relative;width:100vw;height:100vh;pointer-events:none}
.panel{background:var(--glass);border:1px solid var(--edge);box-shadow:0 8px 24px rgba(0,25,45,.12),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.hud > *{z-index:2}

/* ===== ЧАТ ===== */
.chat{
  position:absolute;left:2%;top:2.6%;
  width:min(38vw,600px);min-width:280px;
  padding:8px 12px;border-radius:12px;
  background:rgba(4,43,70,.12);
  border-color:rgba(70,210,246,.35);
  box-shadow:0 6px 18px rgba(0,25,45,.08),inset 0 1px 0 rgba(255,255,255,.05);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  pointer-events:auto;
  z-index:1;
}
#chat-messages{min-height:174px;max-height:32vh;overflow:hidden;margin-top:0;display:flex;flex-direction:column;gap:4px}
.message{font-size:clamp(11px,.95vw,14px);line-height:1.3;color:#effaff;text-shadow:0 1px 2px rgba(0,20,35,.7);overflow-wrap:anywhere}
.time{color:#b8efff;margin-right:7px}.tag{font-weight:700}.tag.vip{color:#f4dba0}.tag.admin{color:#f0b5bf}.tag.radio{color:#b3f0d8}
.input-wrap{display:none;margin-top:8px}.input-wrap.active{display:flex}
#chat-input{width:100%;border:1px solid var(--edge);border-radius:7px;padding:8px 10px;background:rgba(0,28,46,.8);color:white;outline:none;font:inherit}

/* ===== ПРАВЫЙ БЛОК: ПАРАЛЛЕЛОГРАММ ===== */
.right{
  position:absolute;top:2.7%;right:2%;
  width:min(19vw,292px);min-width:230px;
  --money-h:42px;
  filter:drop-shadow(0 0 14px rgba(53,212,242,.22));
}
.right::before{
  content:'';position:absolute;inset:0;z-index:0;
  background:rgba(65,211,247,.55);
  clip-path:polygon(20px 0, 100% 0, calc(100% - 20px) 100%, 0 100%);
}
.right::after{
  content:'';position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,
    rgba(2,20,36,.94) 0,
    rgba(2,20,36,.94) calc(var(--money-h) - 1px),
    rgba(53,212,242,.60) calc(var(--money-h) - 1px),
    rgba(53,212,242,.60) var(--money-h),
    rgba(4,43,70,.78) var(--money-h),
    rgba(9,74,105,.55) 100%
  );
  clip-path:polygon(21px 1px, calc(100% - 1px) 1px, calc(100% - 21px) calc(100% - 1px), 1px calc(100% - 1px));
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
}
.right > *{position:relative;z-index:2}

.money{
  display:flex;align-items:center;justify-content:flex-start;gap:9px;
  height:var(--money-h);
  padding:0 20px 0 26px;
  margin:0;
  font-size:clamp(18px,1.65vw,25px);font-weight:850;letter-spacing:.6px;color:#eefaff;
  text-shadow:0 2px 0 #07536a;
}
.ruble{display:inline-flex;align-items:center;justify-content:center;font-size:1.2em;font-weight:900;line-height:1;color:#7ff0ff;text-shadow:0 0 10px rgba(53,212,242,.9),0 1px 0 #07536a;margin-right:1px}

/* Статы: прижаты к левому краю */
.stats{padding:10px 22px 10px 26px;display:flex;flex-direction:column;align-items:stretch;gap:4px}
.stat{
  display:grid;
  grid-template-columns:22px minmax(58px,1fr) 24px;
  align-items:center;gap:7px;
  margin:0;
  justify-content:start;
}
.icon{font-size:17px;text-align:left;line-height:1;filter:brightness(0) invert(0.82) sepia(1) saturate(4) hue-rotate(150deg) brightness(1.15)}
.bar{height:10px;border-radius:99px;padding:1px;background:rgba(0,22,39,.62);border:1px solid rgba(165,225,241,.28);overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .2s ease}
.health{background:linear-gradient(90deg,#b5dce9,#e4f7ff)}.hunger{background:linear-gradient(90deg,#b5dce9,#e4f7ff)}
.value{text-align:right;font-size:11px;font-weight:750;color:#effaff}

/* ===== ЛОГО ===== */
.brand{position:absolute;right:0.8%;bottom:2%;display:block}
.logo{width:clamp(140px,12.5vw,190px);height:auto;display:block;filter:drop-shadow(0 3px 8px rgba(0,25,45,.25))}

/* ===== ID ===== */
.player{
  position:absolute;left:7%;bottom:2%;
  transform:translateX(-25%);
  display:flex;align-items:center;gap:6px;
  padding:4px 8px;border:1px solid rgba(65,207,245,.38);border-radius:7px;
  background:rgba(4,43,70,.45);font-size:11px;color:#d4f3fc;
}
.player-icon{width:18px;height:18px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(180,234,249,.6);color:#e7f6fc;font-size:10px}
.player strong{color:white}

@media(max-width:700px){
  .chat{min-width:0;width:58vw;padding:7px 10px}
  #chat-messages{min-height:150px;max-height:36vh}
  .right{min-width:0;width:34vw;right:2%;--money-h:36px}
  .money{padding:0 16px 0 22px}
  .stats{padding:7px 16px 7px 20px}
  .stat{grid-template-columns:18px minmax(40px,1fr) 22px;gap:5px}
  .value{font-size:10px}
  .brand{right:0.8%;bottom:1.5%}
  .logo{width:clamp(110px,20vw,150px)}
  .player{left:6%;bottom:1.5%}
}
</style>
</head>
<body>
<div class="hud">
  <section class="chat panel">
    <div id="chat-messages" aria-live="polite"></div>
    <div class="input-wrap" id="input-wrap"><input id="chat-input" placeholder="Введите сообщение..." maxlength="180"></div>
  </section>

  <aside class="right">
    <div class="money"><span class="ruble">₽</span><span id="money">000000</span></div>
    <div class="stats">
      <div class="stat"><span class="icon">♥</span><div class="bar"><div class="fill health" id="health-fill" style="width:100%"></div></div><span class="value" id="health-value">100</span></div>
      <div class="stat"><span class="icon">🍗</span><div class="bar"><div class="fill hunger" id="hunger-fill" style="width:78%"></div></div><span class="value" id="hunger-value">78</span></div>
    </div>
  </aside>

  <section class="brand">
    <img class="logo" src="assets/waterfall-logo.png" alt="WaterFall RolePlay">
  </section>

  <div class="player"><span class="player-icon">●</span><span>ID игрока: <strong id="player-id">123</strong></span></div>
</div>
<script>
const $=id=>document.getElementById(id);
function setBar(name,value){const n=Math.max(0,Math.min(100,Number(value)||0));$(`${name}-fill`).style.width=n+'%';$(`${name}-value`).textContent=Math.round(n)}
function setHealth(v){setBar('health',v)}
function setHunger(v){setBar('hunger',v)}
function setMoney(value){const n=Math.max(0,Math.floor(Number(value)||0));$('money').textContent=n.toLocaleString('ru-RU').replace(/\s/g,' ').padStart(6,'0')}
function setPlayerId(value){$('player-id').textContent=String(value)}
function addChatMessage(text,type=''){const row=document.createElement('div');row.className='message';const time=document.createElement('span');time.className='time';time.textContent='['+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+'] ';row.appendChild(time);const content=document.createElement('span');if(type)content.className='tag '+type;content.textContent=String(text);row.appendChild(content);$('chat-messages').appendChild(row);while($('chat-messages').children.length>8)$('chat-messages').firstElementChild.remove()}
let chatOpen=false;
function toggleChat(force){chatOpen=typeof force==='boolean'?force:!chatOpen;$('input-wrap').classList.toggle('active',chatOpen);if(chatOpen)$('chat-input').focus();else $('chat-input').blur()}
document.addEventListener('keydown',e=>{if(e.key==='F2'){e.preventDefault();toggleChat()}if(e.key==='Escape'&&chatOpen)toggleChat(false)});
$('chat-input').addEventListener('keydown',e=>{if(e.key==='Enter'){const t=e.target.value.trim();if(t)addChatMessage('Вы: '+t);e.target.value='';toggleChat(false)}});
window.setHealth=setHealth;window.setHunger=setHunger;window.setMoney=setMoney;window.setPlayerId=setPlayerId;window.addChatMessage=addChatMessage;window.toggleChat=toggleChat;
</script>
</body>
</html>
