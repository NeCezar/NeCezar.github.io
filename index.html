<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; overflow: hidden; background: transparent; font-family: Arial, sans-serif; }
        #money-container {
            position: absolute; top: 20px; right: 20px; color: #4CAF50; font-size: 24px;
            font-weight: bold; text-shadow: 2px 2px 2px #000; background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px; border-radius: 5px; border: 1px solid #4CAF50;
        }
    </style>
</head>
<body>
    <div id="money-container">
        $<span id="money-value">0</span>
    </div>

    <script>
        // Слушаем событие из Pawn
        cef.on("updateMoney", function(amount) {
            console.log("Получены данные:", amount);
            
            // Если пришла строка, просто выводим её
            if (amount !== undefined) {
                document.getElementById('money-value').innerText = amount;
            }
        });
    </script>
</body>
</html>
